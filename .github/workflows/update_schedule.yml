name: Aggiorna Orario Lezioni

on:
  schedule:
    # Esegue ogni giorno alle 05:00 UTC (07:00 italiane)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Esegui Scraper
        run: python scraper.py

      - name: Verifica e Commit schedule.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schedule.json
          if git status --porcelain | grep -q 'schedule.json'; then
            git commit -m "Auto-update orario lezioni"
            git push
            echo "File schedule.json aggiornato e pubblicato con successo!"
          else
            echo "Nessuna variazione trovata nel file schedule.json."
          fi
