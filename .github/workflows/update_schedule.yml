name: Aggiorna Orario Lezioni

on:
  schedule:
    # Esegue ogni giorno alle 05:00 UTC (07:00 italiane)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette di avviare l'aggiornamento manualmente con un click

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Esegui Scraper
        run: python scraper.py

      - name: Commit e Push delle modifiche
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add schedule.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update orario lezioni [skip ci]" && git push)
